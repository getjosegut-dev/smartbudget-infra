# Generado automáticamente — no editar a mano.
# La fuente de verdad de este archivo vive en el repositorio privado del
# proyecto. Los comentarios se eliminan al publicar.

name: Health Snapshot

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  APP_URL: https://smartbudget-ai-eight.vercel.app
  DASHBOARD_URL: https://smartbudget-analytics-dashboard.vercel.app
  PUBLIC_CI_WORKFLOWS: 'Database Backup,Database Health'

jobs:
  snapshot:
    name: Chequear componentes y enviar snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chequear App
        id: app
        run: |
          if curl -fsS --max-time 10 "$APP_URL" > /dev/null; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "detail=" >> "$GITHUB_OUTPUT"
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "detail=no responde" >> "$GITHUB_OUTPUT"
          fi

      - name: Chequear Bot (webhook de Telegram)
        id: bot
        env:
          BOT_HEALTH_SECRET: ${{ secrets.BOT_HEALTH_SECRET }}
        run: |
          if curl -fsS --max-time 10 "$APP_URL/api/admin/bot-health" \
            -H "Authorization: Bearer ${BOT_HEALTH_SECRET}" > /dev/null; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "detail=" >> "$GITHUB_OUTPUT"
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "detail=webhook no responde o desincronizado" >> "$GITHUB_OUTPUT"
          fi

      - name: Chequear Dashboard
        id: dashboard
        run: |
          if curl -fsS --max-time 10 "$DASHBOARD_URL" > /dev/null; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "detail=" >> "$GITHUB_OUTPUT"
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "detail=no responde" >> "$GITHUB_OUTPUT"
          fi

      - name: Chequear CI (última corrida de cada workflow trackeado)
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO_SLUG }}
          PRIVATE_CI_WORKFLOWS: ${{ secrets.PRIVATE_CI_WORKFLOWS }}
        run: |
          failed=""
          blind=""

          check_repo() {
            local repo="$1" list="$2" token="$3"
            IFS=',' read -ra NAMES <<< "$list"
            for name in "${NAMES[@]}"; do
              [ -z "$name" ] && continue
              conclusion=$(GH_TOKEN="$token" gh run list --repo "$repo" \
                --workflow "$name" --limit 1 --json conclusion \
                --jq '.[0].conclusion // "none"' 2>/dev/null || echo "error")
              case "$conclusion" in
                failure|timed_out|startup_failure) failed="${failed}${name}, " ;;
                none|error) blind="${blind}${name}, " ;;
              esac
            done
          }

          check_repo "${{ github.repository }}" "$PUBLIC_CI_WORKFLOWS" "$GH_TOKEN"

          runner_detail=""
          if [ -n "$PRIVATE_TOKEN" ] && [ -n "$PRIVATE_REPO" ]; then
            check_repo "$PRIVATE_REPO" "$PRIVATE_CI_WORKFLOWS" "$PRIVATE_TOKEN"

            offline=$(GH_TOKEN="$PRIVATE_TOKEN" gh api \
              "repos/$PRIVATE_REPO/actions/runners" \
              --jq '[.runners[] | select(.status != "online")] | length' 2>/dev/null || echo "error")
            if [ "$offline" = "error" ]; then
              blind="${blind}runner, "
            elif [ "$offline" != "0" ]; then
              runner_detail="ejecutor de CI no disponible (corridas encoladas, no fallan)"
            fi
          else
            blind="${blind}repo privado (falta PRIVATE_REPO_READ_TOKEN), "
          fi

          echo "runner_detail=$runner_detail" >> "$GITHUB_OUTPUT"

          if [ -n "$runner_detail" ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "detail=$runner_detail" >> "$GITHUB_OUTPUT"
          elif [ -n "$failed" ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "detail=última corrida en failure: ${failed%, }" >> "$GITHUB_OUTPUT"
          elif [ -n "$blind" ]; then
            echo "status=degraded" >> "$GITHUB_OUTPUT"
            echo "detail=sin visibilidad de: ${blind%, }" >> "$GITHUB_OUTPUT"
          else
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "detail=" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar si el ejecutor de CI no está disponible
        if: steps.ci.outputs.runner_detail != ''
        env:
          BACKUP_ALERT_SECRET: ${{ secrets.BACKUP_ALERT_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/admin/backup-alert" \
            -H "Authorization: Bearer ${BACKUP_ALERT_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"message":"Ejecutor de CI no disponible: las corridas quedan ENCOLADAS, no fallan, asi que este es el unico aviso. Revisar y volver a levantarlo."}' \
            || echo "No se pudo avisar (best-effort)."

      - name: Enviar snapshot
        env:
          HEALTH_SNAPSHOT_SECRET: ${{ secrets.HEALTH_SNAPSHOT_SECRET }}
          APP_STATUS: ${{ steps.app.outputs.status }}
          APP_DETAIL: ${{ steps.app.outputs.detail }}
          BOT_STATUS: ${{ steps.bot.outputs.status }}
          BOT_DETAIL: ${{ steps.bot.outputs.detail }}
          DASHBOARD_STATUS: ${{ steps.dashboard.outputs.status }}
          DASHBOARD_DETAIL: ${{ steps.dashboard.outputs.detail }}
          CI_STATUS: ${{ steps.ci.outputs.status }}
          CI_DETAIL: ${{ steps.ci.outputs.detail }}
        run: |
          payload=$(jq -n \
            --arg appStatus "$APP_STATUS" --arg appDetail "$APP_DETAIL" \
            --arg botStatus "$BOT_STATUS" --arg botDetail "$BOT_DETAIL" \
            --arg dashStatus "$DASHBOARD_STATUS" --arg dashDetail "$DASHBOARD_DETAIL" \
            --arg ciStatus "$CI_STATUS" --arg ciDetail "$CI_DETAIL" \
            '{
              app: { status: $appStatus, detail: (if $appDetail == "" then null else $appDetail end) },
              bot: { status: $botStatus, detail: (if $botDetail == "" then null else $botDetail end) },
              dashboard: { status: $dashStatus, detail: (if $dashDetail == "" then null else $dashDetail end) },
              ci: { status: $ciStatus, detail: (if $ciDetail == "" then null else $ciDetail end) }
            }')

          curl -fsS -X POST "$APP_URL/api/admin/health-snapshot" \
            -H "Authorization: Bearer ${HEALTH_SNAPSHOT_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload"
