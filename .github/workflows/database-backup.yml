# Generado automáticamente — no editar a mano.
# La fuente de verdad de este archivo vive en el repositorio privado del
# proyecto. Los comentarios se eliminan al publicar.

name: Database Backup

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt and store a production backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install matching postgresql-client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          sudo sed -i 's|deb https|deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] https|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump production database
        env:
          BACKUP_READER_URL: ${{ secrets.BACKUP_READER_URL }}
        run: |
          pg_dump --format=custom --no-owner --no-privileges \
            --inserts --column-inserts \
            --schema=public \
            --dbname="$BACKUP_READER_URL" \
            --file=backup.dump

      - name: Verify dump integrity (fail loud, never upload a bad dump)
        run: |
          size=$(stat -c%s backup.dump)
          echo "Tamaño del dump: $size bytes"
          if [ "$size" -lt 100 ]; then
            echo "::error::El dump quedó sospechosamente vacío/incompleto ($size bytes) — no se cifra ni se sube."
            exit 1
          fi
          pg_restore --list backup.dump > /dev/null || {
            echo "::error::pg_restore --list no pudo leer el dump generado — probablemente corrupto."
            exit 1
          }

      - name: Encrypt the dump
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          echo -n "$BACKUP_GPG_PASSPHRASE" > /tmp/passphrase.txt
          gpg --symmetric --cipher-algo AES256 --batch --yes \
            --passphrase-file /tmp/passphrase.txt \
            --output backup.dump.gpg \
            backup.dump
          shred -u /tmp/passphrase.txt
          rm -f backup.dump

      - name: Compute staged retention
        id: retention
        run: |
          hour=$(date -u +%H)
          if [ "$hour" = "00" ]; then
            echo "days=30" >> "$GITHUB_OUTPUT"
            echo "Primera corrida del día UTC — retención larga (30 días)."
          else
            echo "days=2" >> "$GITHUB_OUTPUT"
            echo "Corrida intradiaria — retención corta (2 días)."
          fi

      - name: Name the artifact
        id: name
        run: echo "value=smartbudget-backup-$(date -u +%Y%m%d-%H%M%S)-UTC" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: backup.dump.gpg
          retention-days: ${{ steps.retention.outputs.days }}
          if-no-files-found: error

      - name: Notify admin on failure
        if: failure()
        env:
          BACKUP_ALERT_SECRET: ${{ secrets.BACKUP_ALERT_SECRET }}
        run: |
          curl -fsS -X POST "https://smartbudget-ai-eight.vercel.app/api/admin/backup-alert" \
            -H "Authorization: Bearer ${BACKUP_ALERT_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"⚠️ Falló el backup programado de la base de datos (database-backup.yml). Revisar: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
