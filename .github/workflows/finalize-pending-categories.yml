name: Finalize pending category questions

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  finalize:
    name: Finalize expired pending categories
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al endpoint del cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "https://smartbudget-ai-eight.vercel.app/api/cron/finalize-pending-categories" \
            -H "Authorization: Bearer ${CRON_SECRET}"
